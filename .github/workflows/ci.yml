name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: Collation regression tests (Saktumiva submodule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/js/package-lock.json
      - run: npm ci
        working-directory: tests/js
      - run: node --test
        working-directory: tests/js

  python:
    name: Server tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - name: The installed command starts
        run: saktumiva-editor --version

  browser:
    name: Browser tests (Playwright, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[test,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/python/test_browser_several.py
