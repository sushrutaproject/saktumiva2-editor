# Dependabot proposes updates as pull requests; the tests (ci.yml) run on each one.
# A Saktumiva update that changes the collation or apparatus fails the regression tests:
# review the difference, and if it is an improvement, update tests/golden (see README).
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "Saktumiva"
    labels: [saktumiva-update]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /tests/js
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
